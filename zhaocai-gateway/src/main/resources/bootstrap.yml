# Tomcat
server:
  port: 8052

# Spring
spring:
  application:
    # 应用名称
    name: zhaocai-gateway
  profiles:
    # 环境配置
    active: dev
  cloud:
    nacos:
      username: nacos
      password: nacos
      discovery:
        # 服务注册地址
        server-addr: 192.168.6.6:8848
        namespace: f42de7a9-d7c1-4008-b859-fef8e7ed30a9
        group: zhaocai
      config:
        # 配置中心地址
        server-addr: 192.168.6.6:8848
        namespace: f42de7a9-d7c1-4008-b859-fef8e7ed30a9
        group: DEFAULT_GROUP
        prefix: zhaocai-gateway-dev
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - data-id: application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
            group: DEFAULT_GROUP
            refresh: true
    sentinel:
      # 取消控制台懒加载
      eager: true
      transport:
        # 控制台地址
        dashboard: 127.0.0.1:8718
      # nacos配置持久化
      datasource:
        ds1:
          nacos:
            server-addr: 192.168.6.6:8848
            dataId: sentinel-zhaocai-gateway
            groupId: DEFAULT_GROUP
            data-type: json
            rule-type: gw-flow
