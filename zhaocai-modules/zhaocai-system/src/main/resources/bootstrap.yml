# Tomcat
server:
  port: 9209

# Spring
spring:
  application:
    # 应用名称
    name: zhaocai-system
  profiles:
    # 环境配置
    active: prod
  cloud:
    nacos:
      username: nacos
      password: nacos
      discovery:
        # 服务注册地址
        server-addr: 192.168.241.87:31755
        metadata:
          version: cm
      config:
        # 配置中心地址
        server-addr: 192.168.241.87:31755
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
