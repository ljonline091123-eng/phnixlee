version : '3.8'
services:
  zhaocai-nacos:
    container_name: zhaocai-nacos
    image: nacos/nacos-server
    build:
      context: ./nacos
    environment:
      - MODE=standalone
    volumes:
      - ./nacos/logs/:/home/nacos/logs
      - ./nacos/conf/application.properties:/home/nacos/conf/application.properties
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    depends_on:
      - zhaocai-mysql
  zhaocai-mysql:
    container_name: zhaocai-mysql
    image: mysql:5.7
    build:
      context: ./mysql
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/conf:/etc/mysql/conf.d
      - ./mysql/logs:/logs
      - ./mysql/data:/var/lib/mysql
    command: [
          'mysqld',
          '--innodb-buffer-pool-size=80M',
          '--character-set-server=utf8mb4',
          '--collation-server=utf8mb4_unicode_ci',
          '--default-time-zone=+8:00',
          '--lower-case-table-names=1'
        ]
    environment:
      MYSQL_DATABASE: 'ry-cloud'
      MYSQL_ROOT_PASSWORD: password
  zhaocai-redis:
    container_name: zhaocai-redis
    image: redis
    build:
      context: ./redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis/conf/redis.conf:/home/zhaocai/redis/redis.conf
      - ./redis/data:/data
    command: redis-server /home/zhaocai/redis/redis.conf
  zhaocai-nginx:
    container_name: zhaocai-nginx
    image: nginx
    build:
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/html/dist:/home/zhaocai/projects/zhaocai-ui
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/logs:/var/log/nginx
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - zhaocai-gateway
    links:
      - zhaocai-gateway
  zhaocai-gateway:
    container_name: zhaocai-gateway
    build:
      context: ./zhaocai/gateway
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - zhaocai-redis
    links:
      - zhaocai-redis
  zhaocai-auth:
    container_name: zhaocai-auth
    build:
      context: ./zhaocai/auth
      dockerfile: dockerfile
    ports:
      - "9200:9200"
    depends_on:
      - zhaocai-redis
    links:
      - zhaocai-redis
  zhaocai-modules-system:
    container_name: zhaocai-modules-system
    build:
      context: ./zhaocai/modules/system
      dockerfile: dockerfile
    ports:
      - "9201:9201"
    depends_on:
      - zhaocai-redis
      - zhaocai-mysql
    links:
      - zhaocai-redis
      - zhaocai-mysql
  zhaocai-modules-gen:
    container_name: zhaocai-modules-gen
    build:
      context: ./zhaocai/modules/gen
      dockerfile: dockerfile
    ports:
      - "9202:9202"
    depends_on:
      - zhaocai-mysql
    links:
      - zhaocai-mysql
  zhaocai-modules-job:
    container_name: zhaocai-modules-job
    build:
      context: ./zhaocai/modules/job
      dockerfile: dockerfile
    ports:
      - "9203:9203"
    depends_on:
      - zhaocai-mysql
    links:
      - zhaocai-mysql
  zhaocai-modules-file:
    container_name: zhaocai-modules-file
    build:
      context: ./zhaocai/modules/file
      dockerfile: dockerfile
    ports:
      - "9300:9300"
    volumes:
    - ./zhaocai/uploadPath:/home/zhaocai/uploadPath
  zhaocai-visual-monitor:
    container_name: zhaocai-visual-monitor
    build:
      context: ./zhaocai/visual/monitor
      dockerfile: dockerfile
    ports:
      - "9100:9100"
