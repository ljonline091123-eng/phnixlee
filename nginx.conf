server {
        listen       80; #前端项目的端口
        server_name  localhost;
        proxy_buffers 16 1024k;
        proxy_buffer_size 1024k;
        location / {
            alias   /data/nginx/html/; #vue前端项目打包后的dist文件夹的地址的路径
            index  index.html index.htm;
            try_files $uri $uri/ /zhaocai/index.html;
        }
        
        location /zhaocai/minio/ {
            rewrite ^/zhaocai/minio/(.*)$ /$1 break; 
            proxy_pass http://192.168.241.107:9000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        location  /prod-api/{
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_body_buffer_size 10m;
            client_max_body_size 100M;
            proxy_buffering off;
            proxy_pass http://gatewaybackend:8080/;       #后台项目的运行端口
        }
        location /dev-api/{
             proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_body_buffer_size 10m;
            client_max_body_size 100M;
            proxy_pass http://gatewaybackend:8080/;       #后台项目的运行端口
        }


        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
}