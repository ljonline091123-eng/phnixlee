services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - quant-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quant_agent
      POSTGRES_USER: quant_user
      POSTGRES_PASSWORD: quant_password
    ports:
      - "5432:5432"
    volumes:
      - quant-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant_user -d quant_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://quant_user:quant_password@postgres:5432/quant_agent
      LAKE_STORAGE_BACKEND: minio
      LAKE_S3_ENDPOINT: minio:9000
      LAKE_S3_ACCESS_KEY: minioadmin
      LAKE_S3_SECRET_KEY: minioadmin
      LAKE_S3_BUCKET: quant-lake
      APP_ENV: docker
      MODEL_CREDENTIAL_KEY: ${MODEL_CREDENTIAL_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.jobs.worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://quant_user:quant_password@postgres:5432/quant_agent
      LAKE_STORAGE_BACKEND: minio
      LAKE_S3_ENDPOINT: minio:9000
      LAKE_S3_ACCESS_KEY: minioadmin
      LAKE_S3_SECRET_KEY: minioadmin
      LAKE_S3_BUCKET: quant-lake
      APP_ENV: docker
      MODEL_CREDENTIAL_KEY: ${MODEL_CREDENTIAL_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_healthy

  scheduler:
    build:
      context: ./backend
    command: ["python", "-m", "app.jobs.scheduler"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://quant_user:quant_password@postgres:5432/quant_agent
      LAKE_STORAGE_BACKEND: minio
      LAKE_S3_ENDPOINT: minio:9000
      LAKE_S3_ACCESS_KEY: minioadmin
      LAKE_S3_SECRET_KEY: minioadmin
      LAKE_S3_BUCKET: quant-lake
      APP_ENV: docker
      MODEL_CREDENTIAL_KEY: ${MODEL_CREDENTIAL_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  quant-postgres-data:
  quant-minio-data:
