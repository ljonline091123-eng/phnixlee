services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quant_agent
      POSTGRES_USER: quant_user
      POSTGRES_PASSWORD: quant_password
    ports:
      - "5432:5432"
    volumes:
      - quant-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant_user -d quant_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://quant_user:quant_password@postgres:5432/quant_agent
      APP_ENV: docker
      MODEL_CREDENTIAL_KEY: ${MODEL_CREDENTIAL_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  quant-postgres-data:
