<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FiveLines 经典汽车 · 真实收藏卡</title>
  <style>
    *{box-sizing:border-box} html,body{margin:0;background:#11161b;color:#f7f8f5;font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}
    #catalog{width:2480px;margin:0 auto;padding:58px 58px 86px}.header{display:flex;align-items:end;justify-content:space-between;margin:0 8px 34px}.header h1{margin:0;font-size:54px;letter-spacing:-2px}.header p{margin:12px 0 0;color:#aeb9bc;font-size:22px}.count{font:900 34px/1 Consolas,monospace;color:#f5bd58}
    .cards{display:grid;grid-template-columns:repeat(4,568px);gap:30px}.card{position:relative;width:568px;height:830px;overflow:hidden;border:2px solid #d1d6d0;border-radius:26px;background:#0b1014;box-shadow:0 18px 0 #020405,0 30px 50px #000a}.card:before{content:"";position:absolute;inset:7px;z-index:9;border:1px solid #fff7;border-radius:20px;pointer-events:none}.top{position:relative;z-index:4;height:112px;display:flex;align-items:center;padding:26px 28px 14px;background:linear-gradient(120deg,#12181d,#2a3034);border-bottom:1px solid #ffffff33}.id{font:900 24px/1 Consolas,monospace;color:var(--accent)}.edition{margin-left:auto;padding:7px 13px;border:1px solid var(--accent);border-radius:999px;color:var(--accent);font:900 15px/1 Consolas,monospace;letter-spacing:1px}.hero{position:relative;height:382px;overflow:hidden;background:#222}.hero img{width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(1.14) contrast(1.08)}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0006 0,#0000 34%,#0002 56%,#05080dcc 100%),linear-gradient(115deg,#fff0 0 56%,#fff3 57% 58%,#fff0 59%);mix-blend-mode:normal}.foil{position:absolute;inset:0;z-index:2;opacity:.7;background:linear-gradient(117deg,transparent 0 33%,#fff0 34%,#ffffff3b 36%,#fff0 40%,transparent 41% 63%,#fff0 64%,#ffffff2e 66%,#fff0 70%,transparent 71%);mix-blend-mode:screen}.badge{position:absolute;left:24px;top:22px;z-index:4;padding:8px 12px;border-radius:5px;background:#0d1316d9;border:1px solid #fff8;color:#fff;font:900 14px/1 Consolas,monospace;letter-spacing:1px}.spec{position:absolute;right:22px;top:22px;z-index:4;text-align:right;color:#fff;font:800 13px/1.45 Consolas,monospace;text-shadow:0 2px 4px #000}.spec b{display:block;color:var(--accent);font-size:20px}.lower{position:relative;height:336px;padding:24px 30px;background:linear-gradient(160deg,#141a1e,#080b0e);border-top:4px solid var(--accent)}.group{font-size:16px;font-weight:900;color:var(--accent);letter-spacing:2px}.name{margin:8px 0 19px;font-size:39px;line-height:1.1;letter-spacing:-1px}.meta{display:flex;gap:14px;margin-top:10px}.label{flex:0 0 92px;color:#8c9a9c;font-size:16px;font-weight:900}.value{font-size:18px;line-height:1.4;font-weight:700}.bar{position:absolute;left:30px;right:30px;bottom:78px;height:5px;background:#394247}.bar i{display:block;width:72%;height:100%;background:linear-gradient(90deg,var(--accent),#fff)}.footer{position:absolute;left:0;right:0;bottom:0;height:59px;display:flex;align-items:center;padding:0 30px;background:#06090b;color:#e6ecec;font:800 15px/1 Consolas,monospace;letter-spacing:1px}.state{margin-left:auto;color:var(--accent)}
    .etype{--accent:#f04e49}.gullwing{--accent:#64d8df}.mustang{--accent:#ffc65b}.porsche{--accent:#ff755e}
    .single-mode #catalog{width:680px;padding:56px}.single-mode .header,.single-mode .card:not(.capture){display:none}.single-mode .cards{display:block}.single-mode .card.capture{display:block}
  </style>
</head>
<body>
<main id="catalog"><header class="header"><div><h1>FiveLines · 经典汽车真实收藏卡</h1><p>实拍车身 + 黑钛卡框 + 镜面镭射箔 · 重新定义汽车主题能力卡</p></div><div class="count">REAL / 04</div></header><section class="cards" id="cards"></section></main>
<script>
const cards=[
 {id:'real-01-etype', cls:'etype', no:'REAL-01', edition:'HERITAGE / 01', group:'经典汽车 · 流线猎手', name:'连击初体验', condition:'首次连续回合完成消除', effect:'记录首次连击', image:'source/jaguar-e-type-v2.jpg', badge:'1964 COUPE · SCULPTED', spec:'3.8 L / INLINE-6', note:'CHROME / LACQUER'},
 {id:'real-02-gullwing', cls:'gullwing', no:'REAL-02', edition:'HERITAGE / 02', group:'经典汽车 · 银箭传奇', name:'高分挑战者', condition:'单局达到 2,500 分', effect:'记录高分纪录', image:'source/mercedes-300sl.jpg', badge:'1957 ROADSTER · ICON', spec:'3.0 L / 6-CYL', note:'STEEL / CHROME'},
 {id:'real-03-mustang', cls:'mustang', no:'REAL-03', edition:'HERITAGE / 03', group:'经典汽车 · 公路猛兽', name:'初次开局', condition:'完成首局游戏', effect:'记录首次完成对局', image:'source/mustang-fastback-v2.jpg', badge:'1967 FASTBACK · V8', spec:'4.7 L / V8', note:'MUSCLE / TORQUE'},
 {id:'real-04-911', cls:'porsche', no:'REAL-04', edition:'HERITAGE / 04', group:'经典汽车 · 弯道图腾', name:'空间整理', condition:'成功清理关键通道并完成消除', effect:'记录棋盘规划成就', image:'source/porsche-911-rs-v2.jpg', badge:'1972 RS · AIR-COOLED', spec:'2.7 L / FLAT-6', note:'RS / LIGHTNESS'}
];
const root=document.querySelector('#cards');
for(const c of cards){root.insertAdjacentHTML('beforeend',`<article class="card ${c.cls}" data-card="${c.id}"><div class="top"><span class="id">FL-${c.no}</span><span class="edition">${c.edition}</span></div><div class="hero"><img src="${c.image}" alt="${c.group}"><div class="foil"></div><span class="badge">${c.badge}</span><span class="spec"><b>${c.spec}</b>${c.note}</span></div><div class="lower"><div class="group">${c.group}</div><h2 class="name">${c.name}</h2><div class="meta"><span class="label">点亮条件</span><span class="value">${c.condition}</span></div><div class="meta"><span class="label">卡片能力</span><span class="value">${c.effect}</span></div><div class="bar"><i></i></div></div><footer class="footer"><span>FIVELINES / CLASSIC GARAGE</span><span class="state">待点亮 ◆</span></footer></article>`)}
const selected=new URLSearchParams(location.search).get('card');if(selected){document.body.classList.add('single-mode');const c=document.querySelector(`[data-card="${selected}"]`);if(c)c.classList.add('capture')}
</script>
</body></html>
