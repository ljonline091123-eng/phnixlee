<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FiveLines 能力卡设计方向样卡</title>
  <style>
    * { box-sizing: border-box; }
    :root { --ink:#0c1720; --paper:#f6f8f7; }
    html, body { margin:0; min-height:100%; background:#dfe7e8; color:var(--ink); }
    body { font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif; }
    #catalog { width: 2480px; margin:0 auto; padding:56px; }
    .catalog-header { display:flex; align-items:flex-end; justify-content:space-between; margin:0 8px 30px; }
    .catalog-header h1 { margin:0; font-size:54px; letter-spacing:-2px; }
    .catalog-header p { margin:12px 0 0; color:#4e626b; font-size:22px; }
    .catalog-header .count { font:900 34px/1 Consolas,monospace; color:#e8473f; }
    .cards { display:grid; grid-template-columns:repeat(4, 568px); gap:34px 26px; }
    .ability-card { position:relative; width:568px; height:796px; overflow:hidden; border-radius:24px; border:4px solid var(--ink); background:var(--paper); box-shadow:0 16px 0 var(--ink), 0 22px 36px #14343a22; }
    .ability-card::after { content:""; position:absolute; inset:0; pointer-events:none; border:1px solid #ffffff88; border-radius:20px; }
    .card-top { height:104px; display:flex; align-items:center; gap:14px; padding:26px 30px 12px; background:var(--top,#101b23); color:#fff; }
    .card-no { font:900 27px/1 Consolas,monospace; letter-spacing:1px; color:var(--hot,#ff6158); }
    .card-kind { margin-left:auto; padding:8px 13px; border:2px solid var(--hot,#ff6158); border-radius:999px; color:var(--hot,#ff6158); font-size:17px; font-weight:900; letter-spacing:1px; }
    .art { position:relative; height:356px; overflow:hidden; border-bottom:4px solid var(--ink); background:var(--art,#edf3f0); }
    .card-body { height:278px; padding:24px 30px; background:var(--paper); }
    .card-group { color:var(--hot,#e8473f); font-size:18px; font-weight:900; letter-spacing:1px; }
    .card-name { margin:6px 0 17px; font-size:40px; line-height:1.12; letter-spacing:-1px; }
    .meta { display:flex; align-items:flex-start; gap:12px; margin-top:10px; }
    .meta-label { flex:0 0 92px; color:#62777e; font-size:17px; font-weight:900; }
    .meta-text { font-size:19px; line-height:1.45; font-weight:700; }
    .card-footer { position:absolute; left:0; right:0; bottom:0; height:58px; display:flex; align-items:center; padding:0 30px; background:var(--top,#101b23); color:#fff; font-size:16px; font-weight:800; letter-spacing:1px; }
    .state { margin-left:auto; color:var(--hot,#ff6158); }
    .label { position:absolute; left:24px; top:20px; z-index:5; padding:7px 12px; border-radius:999px; background:#fff; color:var(--ink); font:900 15px/1 Consolas,monospace; letter-spacing:1px; box-shadow:0 3px 0 #0c172055; }
    .arcade { --top:#111b2c; --hot:#ff5364; --art:#111a2d; }
    .tactics { --top:#162d35; --hot:#ffb84d; --art:#dceee5; }
    .medal { --top:#302316; --hot:#e7ad43; --art:#e8c87a; --paper:#fff9eb; }
    .rally { --top:#272022; --hot:#ff4d3f; --art:#f2d2a5; }
    .sports { --top:#17172b; --hot:#ffcf58; --art:#1a2043; --paper:#fbfbff; }
    .pixel { --top:#18233d; --hot:#ffdc57; --art:#79b9b2; --paper:#f3f4e8; }
    .micro { --top:#24312c; --hot:#ef806d; --art:#d6eadb; --paper:#fffdf4; }

    /* arcade chip */
    .chip-board { position:absolute; inset:0; background:radial-gradient(circle at 50% 54%, #26395d 0 25%, transparent 26%), repeating-linear-gradient(90deg,#ffffff0b 0 2px,transparent 2px 34px); }
    .chip { position:absolute; left:148px; top:62px; width:272px; height:224px; border:6px solid #ff5364; border-radius:24px; background:linear-gradient(135deg,#243758,#0b1120); box-shadow:0 0 0 9px #182844,0 0 32px #ff536477; }
    .chip:before,.chip:after { content:""; position:absolute; left:-30px; right:-30px; height:22px; top:28px; border-top:6px solid #35e1d0; border-bottom:6px solid #35e1d0; box-shadow:0 70px 0 -1px #35e1d0,0 140px 0 -1px #35e1d0; }
    .chip:after { left:44px; right:44px; top:-30px; bottom:-30px; width:22px; height:auto; border:0; border-left:6px solid #ff5364; border-right:6px solid #ff5364; box-shadow:70px 0 0 -1px #ff5364,140px 0 0 -1px #ff5364; }
    .chip-title { position:absolute; left:31px; top:25px; color:#b5c4ef; font:900 14px/1 Consolas,monospace; letter-spacing:2px; }
    .line-five { position:absolute; left:42px; top:92px; display:flex; gap:12px; }
    .line-five i { width:34px; height:34px; border-radius:50%; background:#ff5364; border:4px solid #ffb0b7; box-shadow:0 0 20px #ff5364; }
    .energy { position:absolute; left:31px; right:31px; bottom:26px; height:12px; border:2px solid #35e1d0; display:flex; gap:4px; padding:2px; }
    .energy i { flex:1; background:#35e1d0; }

    /* tactics board */
    .board { position:absolute; width:282px; height:282px; left:142px; top:38px; border:6px solid #173c3a; background-color:#eff8ec; background-image:linear-gradient(#173c3a44 3px,transparent 3px),linear-gradient(90deg,#173c3a44 3px,transparent 3px); background-size:35px 35px; box-shadow:15px 15px 0 #173c3a33; }
    .heart { position:absolute; inset:0; background:radial-gradient(circle at 34% 30%,#e65c50 0 11px,transparent 12px),radial-gradient(circle at 66% 30%,#e65c50 0 11px,transparent 12px),linear-gradient(135deg,transparent 49%,#e65c50 50% 63%,transparent 64%); opacity:.85; }
    .path { position:absolute; left:62px; top:204px; width:160px; height:6px; background:#e6a43b; transform:rotate(-45deg); transform-origin:left center; box-shadow:0 0 0 3px #fff; }
    .target { position:absolute; left:205px; top:42px; width:34px; height:34px; border:5px dashed #e65c50; }
    .board-pieces { position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:space-around; padding:0 20px 20px; }
    .board-pieces i { width:26px; height:26px; border-radius:50%; background:#e65c50; border:3px solid #fff; box-shadow:0 2px 0 #173c3a; }
    .arrow { position:absolute; right:72px; top:72px; color:#e65c50; font:900 54px/1 Consolas,monospace; transform:rotate(-24deg); }

    /* medal */
    .medal-bg { position:absolute; inset:0; background:radial-gradient(circle at 50% 48%,#fff3b0 0 18%,transparent 19%),linear-gradient(135deg,#9a6a2b,#f1d27c 45%,#896027); }
    .rays { position:absolute; inset:-80px; background:repeating-conic-gradient(#ffffff22 0 8deg,transparent 8deg 20deg); }
    .medallion { position:absolute; left:118px; top:47px; width:332px; height:270px; border-radius:50%; border:16px solid #6b471e; outline:6px solid #f7e09a; background:radial-gradient(circle at 38% 30%,#ffeaa7,#c4832f 76%); box-shadow:inset 0 0 0 11px #e9bc59,0 18px 0 #6b471e; display:grid; place-items:center; }
    .crown { color:#fff3b0; font-size:112px; line-height:1; text-shadow:4px 5px 0 #6b471e; transform:translateY(-6px); }
    .medal-ribbon { position:absolute; left:219px; top:0; width:130px; height:88px; background:linear-gradient(90deg,#e95445 0 50%,#f2c04b 50%); clip-path:polygon(0 0,100% 0,84% 100%,50% 76%,16% 100%); }
    .rare { position:absolute; right:22px; top:22px; color:#fff0b4; font:900 14px/1 Consolas,monospace; letter-spacing:2px; }

    /* classic car illustrations */
    .sunset { position:absolute; inset:0; background:linear-gradient(#f6ad78 0 38%,#f3d6ad 39% 58%,#7e6a6a 59% 100%); }
    .sunset:before { content:""; position:absolute; width:100px; height:100px; right:60px; top:54px; border-radius:50%; background:#ffe58e; box-shadow:0 0 40px #ffe58e; }
    .road { position:absolute; left:-80px; right:-80px; bottom:30px; height:100px; background:#4b4650; transform:skewY(-7deg); border-top:6px solid #fff3d2; }
    .road:after { content:""; position:absolute; left:60px; right:60px; top:41px; border-top:9px dashed #f8d36b; }
    .car { position:absolute; left:117px; bottom:106px; width:330px; height:110px; }
    .car .body { position:absolute; left:0; right:0; bottom:14px; height:70px; border-radius:28px 54px 20px 20px; background:#d83b3e; border:6px solid #201f2b; box-shadow:inset 0 -18px 0 #a4212b; }
    .car .roof { position:absolute; left:88px; top:0; width:170px; height:57px; border:6px solid #201f2b; border-bottom:0; border-radius:80px 80px 0 0; background:#f2b37b; }
    .car .window { position:absolute; left:104px; top:11px; width:66px; height:35px; background:#8bb5c4; border:4px solid #201f2b; transform:skewX(-13deg); }
    .car .window.two { left:174px; transform:skewX(13deg); }
    .wheel { position:absolute; bottom:0; width:45px; height:45px; border-radius:50%; background:#20202b; border:7px solid #e7d9b9; box-shadow:0 0 0 4px #20202b; }
    .wheel.left { left:41px; } .wheel.right { right:41px; }
    .stripe { position:absolute; left:10px; right:10px; top:44px; border-top:9px solid #f6e9cf; border-bottom:9px solid #f6e9cf; }
    .speed-lines { position:absolute; left:38px; bottom:199px; width:145px; height:50px; border-top:5px solid #fff4dc; border-bottom:5px solid #fff4dc; transform:skewX(-24deg); opacity:.8; }

    .sports-bg { position:absolute; inset:0; background:linear-gradient(#252c66 0 52%,#13162d 53% 100%); }
    .sports-bg:before { content:""; position:absolute; left:0; right:0; bottom:106px; height:6px; background:#ffcf58; box-shadow:0 24px 0 #ffcf58; transform:skewY(-12deg); }
    .neon-road { position:absolute; left:-40px; right:-40px; bottom:10px; height:150px; background:#0d1020; transform:perspective(240px) rotateX(18deg); border-top:4px solid #ff4cbb; }
    .sports-car { position:absolute; left:105px; bottom:127px; width:355px; height:108px; }
    .sports-car .body { position:absolute; inset:32px 0 9px; border:5px solid #101226; border-radius:80px 30px 22px 16px; background:linear-gradient(#f5d257,#d67129); }
    .sports-car .roof { position:absolute; left:103px; top:0; width:162px; height:62px; border:5px solid #101226; border-bottom:0; border-radius:100px 100px 0 0; background:#22284d; }
    .sports-car .light { position:absolute; right:8px; top:55px; width:32px; height:13px; border-radius:50%; background:#fff2b0; box-shadow:0 0 18px #fff2b0; }
    .gauge { position:absolute; right:38px; top:42px; width:86px; height:86px; border:8px solid #ffcf58; border-radius:50%; background:#101226; box-shadow:0 0 0 4px #ffffff44; }
    .gauge:before { content:"HIGH"; position:absolute; left:14px; top:30px; color:#ffcf58; font:900 12px Consolas,monospace; }
    .gauge:after { content:""; position:absolute; left:39px; top:11px; width:4px; height:31px; background:#ffcf58; transform-origin:bottom; transform:rotate(43deg); }

    .pixel-bg { position:absolute; inset:0; background:#79b9b2; image-rendering:pixelated; }
    .pixel-bg:before { content:""; position:absolute; inset:0; background:linear-gradient(#5a8c9e 0 48%,#37526a 49% 63%,#26344f 64%); clip-path:polygon(0 0,100% 0,100% 57%,0 57%); }
    .pixel-sun { position:absolute; left:73px; top:46px; width:62px; height:62px; background:#ffdc57; box-shadow:0 0 0 10px #ffdc5733; }
    .pixel-road { position:absolute; left:0; right:0; bottom:0; height:150px; background:#2b3d58; border-top:10px solid #d9dc9e; }
    .pixel-road:after { content:""; position:absolute; left:40px; right:40px; top:67px; border-top:9px dashed #ffdc57; }
    .pixel-car { position:absolute; left:158px; bottom:127px; width:244px; height:76px; background:#f25b58; border:10px solid #26344f; box-shadow:10px 10px 0 #26344f; }
    .pixel-car:before { content:""; position:absolute; left:50px; top:-43px; width:125px; height:43px; background:#f25b58; border:10px solid #26344f; border-bottom:0; }
    .pixel-wheel { position:absolute; bottom:-29px; width:43px; height:43px; background:#26344f; border:9px solid #b7d2c5; }
    .pixel-wheel.left { left:22px; } .pixel-wheel.right { right:22px; }
    .flag { position:absolute; right:67px; top:73px; width:8px; height:116px; background:#26344f; }
    .flag:after { content:""; position:absolute; top:0; left:8px; width:65px; height:43px; background:repeating-linear-gradient(90deg,#f3f4e8 0 16px,#26344f 16px 32px),repeating-linear-gradient(0deg,transparent 0 16px,#26344f 16px 32px); }

    .micro-bg { position:absolute; inset:0; background:linear-gradient(#d6eadb 0 55%,#9bbda8 56% 100%); }
    .parking { position:absolute; left:34px; right:34px; bottom:38px; height:150px; border:6px solid #e7f2df; transform:skewY(-7deg); }
    .parking:before,.parking:after { content:""; position:absolute; top:0; bottom:0; width:6px; background:#e7f2df; }
    .parking:before { left:33%; } .parking:after { right:33%; }
    .micro-car { position:absolute; left:140px; bottom:127px; width:286px; height:100px; }
    .micro-car .body { position:absolute; inset:22px 0 7px; background:#ef806d; border:6px solid #30423b; border-radius:48px 78px 30px 25px; }
    .micro-car .roof { position:absolute; left:72px; top:0; width:142px; height:58px; background:#e9c5a9; border:6px solid #30423b; border-bottom:0; border-radius:70px 70px 0 0; }
    .micro-car .window { position:absolute; left:90px; top:12px; width:47px; height:31px; border:4px solid #30423b; background:#a8cad1; }
    .micro-car .window.two { left:143px; }
    .micro-wheel { position:absolute; bottom:0; width:41px; height:41px; border-radius:50%; background:#30423b; border:7px solid #f8ebce; }
    .micro-wheel.left { left:40px; } .micro-wheel.right { right:40px; }
    .route { position:absolute; left:57px; top:62px; width:178px; height:64px; border:5px dashed #ef806d; border-left:0; border-bottom:0; border-radius:0 50px 0 0; transform:rotate(-18deg); }
    .route:after { content:"→"; position:absolute; right:-33px; top:-25px; color:#ef806d; font:900 46px Consolas,monospace; }

    .single-mode #catalog { width:680px; padding:56px; }
    .single-mode .catalog-header, .single-mode .ability-card:not(.capture) { display:none; }
    .single-mode .cards { display:block; }
    .single-mode .ability-card.capture { display:block; }
  </style>
</head>
<body>
<main id="catalog">
  <header class="catalog-header"><div><h1>FiveLines 能力卡 · 7 个设计方向样卡</h1><p>先比较视觉语言，再选择一套扩展到完整 54 张能力卡</p></div><div class="count">7 CONCEPTS</div></header>
  <section class="cards" id="cards"></section>
</main>
<script>
const samples = [
  { id:'sample-01-arcade-chip', className:'arcade', no:'01', group:'街机芯片卡', name:'五连新手', kind:'收藏卡', condition:'首次完成五连', effect:'解锁五连纪念标记', label:'方案 A · 芯片 HUD', art:`<div class="chip-board"></div><div class="chip"><div class="chip-title">FIVELINES / CORE</div><div class="line-five"><i></i><i></i><i></i><i></i><i></i></div><div class="energy"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>` },
  { id:'sample-02-tactics-board', className:'tactics', no:'02', group:'棋盘战术卡', name:'每日来客', kind:'挑战卡', condition:'完成 1 次每日挑战', effect:'记录首次挑战', label:'方案 B · 战术棋盘', art:`<div class="board"><div class="heart"></div><div class="path"></div><div class="target"></div><div class="board-pieces"><i></i><i></i><i></i><i></i><i></i></div></div><div class="arrow">↗</div>` },
  { id:'sample-03-medal-collection', className:'medal', no:'03', group:'奖章收藏卡', name:'五线全明星', kind:'传奇卡', condition:'集齐其余 53 张能力卡', effect:'解锁全卡收藏纪念外观', label:'方案 C · 金属奖章', art:`<div class="medal-bg"></div><div class="rays"></div><div class="medal-ribbon"></div><div class="medallion"><div class="crown">♛</div></div><div class="rare">LEGENDARY · FL-54</div>` },
  { id:'sample-04-classic-rally', className:'rally', no:'04', group:'经典拉力小汽车', name:'连击初体验', kind:'收藏卡', condition:'首次连续回合完成消除', effect:'记录首次连击', label:'汽车 1 · 复古拉力', art:`<div class="sunset"></div><div class="speed-lines"></div><div class="road"></div><div class="car"><div class="roof"></div><div class="window"></div><div class="window two"></div><div class="body"><div class="stripe"></div></div><div class="wheel left"></div><div class="wheel right"></div></div>` },
  { id:'sample-05-retro-sports', className:'sports', no:'05', group:'经典小汽车', name:'高分挑战者', kind:'竞速卡', condition:'单局达到 2,500 分', effect:'记录高分纪录', label:'汽车 2 · 70s 跑车', art:`<div class="sports-bg"></div><div class="neon-road"></div><div class="gauge"></div><div class="sports-car"><div class="roof"></div><div class="body"></div><div class="light"></div><div class="wheel left"></div><div class="wheel right"></div></div>` },
  { id:'sample-06-pixel-city-car', className:'pixel', no:'06', group:'像素城市小汽车', name:'初次开局', kind:'入门卡', condition:'完成首局游戏', effect:'记录首次完成对局', label:'汽车 3 · 8-bit 城市', art:`<div class="pixel-bg"></div><div class="pixel-sun"></div><div class="pixel-road"></div><div class="flag"></div><div class="pixel-car"><div class="pixel-wheel left"></div><div class="pixel-wheel right"></div></div>` },
  { id:'sample-07-classic-microcar', className:'micro', no:'07', group:'经典微型小汽车', name:'空间整理', kind:'策略卡', condition:'成功清理关键通道并完成消除', effect:'记录棋盘规划成就', label:'汽车 4 · 城市微型车', art:`<div class="micro-bg"></div><div class="parking"></div><div class="route"></div><div class="micro-car"><div class="roof"></div><div class="window"></div><div class="window two"></div><div class="body"></div><div class="micro-wheel left"></div><div class="micro-wheel right"></div></div>` }
];
const root = document.querySelector('#cards');
for (const s of samples) {
  root.insertAdjacentHTML('beforeend', `<article class="ability-card ${s.className}" data-card="${s.id}">
    <div class="card-top"><span class="card-no">FL-CONCEPT-${s.no}</span><span class="card-kind">${s.kind}</span></div>
    <div class="art"><div class="label">${s.label}</div>${s.art}</div>
    <div class="card-body"><div class="card-group">${s.group}</div><h2 class="card-name">${s.name}</h2><div class="meta"><span class="meta-label">点亮条件</span><span class="meta-text">${s.condition}</span></div><div class="meta"><span class="meta-label">卡片能力</span><span class="meta-text">${s.effect}</span></div></div>
    <footer class="card-footer"><span>FIVELINES ABILITY</span><span class="state">待点亮 ◇</span></footer>
  </article>`);
}
const selected = new URLSearchParams(location.search).get('card');
if (selected) { document.body.classList.add('single-mode'); const card = document.querySelector(`[data-card="${selected}"]`); if (card) card.classList.add('capture'); }
</script>
</body>
</html>
